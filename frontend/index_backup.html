
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>MyFinance</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="marca">
            <span class="logo">💸</span>
            <h1>MyFinance</h1>
        </div>
        <span class="subtitulo">Controle financeiro pessoal</span>
    </header>

<nav class="menu-lateral" aria-label="Menu principal">
    <h3>MENU</h3>

    <button class="menu-item ativo" data-pagina="inicio">
        ◈ Início
    </button>

    <button class="menu-item" data-pagina="movimentacoes">
        ↔ Movimentações
    </button>

    <button class="menu-item" data-pagina="graficos">
        ◉ Gráficos
    </button>

    <button class="menu-item" data-pagina="contas">
        ▣ Contas fixas
    </button>

    <button class="menu-item" data-pagina="configuracoes">
        ⚙ Configurações
    </button>
</nav>

    <main class="container">
        <section class="cabecalho">
            <div>
                <h2>Meu dashboard</h2>
                <p>Acompanhe suas finanças em um só lugar.</p>
            </div>

            <div class="filtros">
                <select id="mes"></select>
                <input type="number" id="ano"
                       min="2000" max="2100">
                <button id="atualizar"
                        class="botao-secundario">
                    Atualizar
                </button>
            </div>
        </section>

        <p id="mensagem" role="status"></p>

        <section class="cards">
            <article class="card">
                <p>Receitas do mês</p>
                <h3 id="receitas" class="verde">R$ 0,00</h3>
            </article>

            <article class="card">
                <p>Despesas do mês</p>
                <h3 id="despesas" class="vermelho">R$ 0,00</h3>
            </article>

            <article class="card">
                <p>Saldo do mês</p>
                <h3 id="saldo">R$ 0,00</h3>
            </article>
        </section>

        <div class="colunas">
            <section class="painel">
                <h3>Nova movimentação</h3>

                <form id="form-transacao">
                    <label for="descricao">Descrição</label>
                    <input id="descricao" maxlength="150"
                           placeholder="Ex.: Supermercado"
                           required>

                    <label for="valor">Valor (R$)</label>
                    <input id="valor" type="number"
                           step="0.01" min="0.01"
                           placeholder="0,00" required>

                    <label for="tipo">Tipo</label>
                    <select id="tipo">
                        <option value="despesa">Despesa</option>
                        <option value="receita">Receita</option>
                    </select>

                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Carregando...</option>
                    </select>

                    <label for="data">Data</label>
                    <input id="data" type="date" required>

                    <button id="salvar" type="submit">
                        Salvar movimentação
                    </button>
                    <button
                        id="cancelar-edicao"
                        class="botao-secundario"
                        type="button"
                        hidden>
                        Cancelar edição
                    </button>
                </form>
            </section>

            <section class="painel">
                <h3>Despesas por categoria</h3>
                <div id="categorias-grafico"></div>
            </section>
        </div>

        <section class="painel">
            <h3>Movimentações do mês</h3>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-transacoes"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
